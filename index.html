<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101c1b">
  <meta name="description" content="Explore a filesystem as a text adventure. An offline MUD shell in your browser.">
  <title>MUD Shell · Expedition</title><link rel="stylesheet" href="./style.css">
</head>
<body>
  <header><a class="brand" href="./"><span aria-hidden="true">✥</span> MUD Shell</a>
    <nav><a href="https://github.com/gipapa/mudsh_ai">Source ↗</a><button id="new">New expedition</button></nav></header>
  <main>
    <section class="landscape" aria-labelledby="realm"><canvas aria-hidden="true"></canvas>
      <div class="caption"><span class="eyebrow" id="region">Expedition</span><h1 id="realm">Opening the atlas…</h1><span id="seed"></span></div>
    </section>
    <div class="workspace">
      <section class="console"><div class="section-title"><h2>Expedition log</h2><span class="status">Sprite offline</span></div>
        <div id="log" role="log" aria-label="Terminal output" tabindex="0"></div>
        <form><label for="command" aria-label="Command">❯</label><input id="command" placeholder="Enter a command…" autocomplete="off" maxlength="8192" spellcheck="false" disabled><button id="run" disabled>Run ↵</button></form>
        <div class="shortcuts"><button data-line="look">look</button><button data-line="back">back</button><button data-line="help">help</button><button data-line="!pwd">!pwd</button></div>
      </section>
      <aside><div class="section-title"><h2>Room survey</h2><span aria-hidden="true">⌖</span></div>
        <div class="survey"><span class="eyebrow">Current room</span><h3 id="room">…</h3><code id="cwd"></code>
        <h4>Exits</h4><div id="exits"></div><h4>Objects</h4><div id="objects"></div></div>
      </aside>
    </div>
  </main>
  <footer><span>Browser expedition · In-memory world</span><a href="./licenses/credits.txt">Licenses</a></footer>
  <dialog><h2>Start a new expedition?</h2><p>This will replace the current map, files and log.</p>
    <div><button id="cancel">Keep exploring</button> <button id="restart">Start expedition</button></div></dialog>
  <script type="module" src="./app.js"></script>
</body></html>
